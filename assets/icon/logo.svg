<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions for a modern look -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Queue representation - stylized people in line -->
  <!-- Person 1 (Current/Active) -->
  <g transform="translate(70, 60)">
    <!-- Head -->
    <circle cx="0" cy="0" r="8" fill="url(#accentGradient)"/>
    <!-- Body -->
    <rect x="-6" y="8" width="12" height="20" rx="6" fill="url(#accentGradient)"/>
    <!-- Arms -->
    <rect x="-10" y="12" width="4" height="12" rx="2" fill="url(#accentGradient)"/>
    <rect x="6" y="12" width="4" height="12" rx="2" fill="url(#accentGradient)"/>
    <!-- Legs -->
    <rect x="-6" y="28" width="4" height="15" rx="2" fill="url(#accentGradient)"/>
    <rect x="2" y="28" width="4" height="15" rx="2" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(100, 70)">
    <circle cx="0" cy="0" r="7" fill="rgba(255,255,255,0.9)"/>
    <rect x="-5" y="7" width="10" height="18" rx="5" fill="rgba(255,255,255,0.9)"/>
    <rect x="-8" y="11" width="3" height="10" rx="1.5" fill="rgba(255,255,255,0.9)"/>
    <rect x="5" y="11" width="3" height="10" rx="1.5" fill="rgba(255,255,255,0.9)"/>
    <rect x="-5" y="25" width="3" height="12" rx="1.5" fill="rgba(255,255,255,0.9)"/>
    <rect x="2" y="25" width="3" height="12" rx="1.5" fill="rgba(255,255,255,0.9)"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(130, 80)">
    <circle cx="0" cy="0" r="6" fill="rgba(255,255,255,0.7)"/>
    <rect x="-4" y="6" width="8" height="15" rx="4" fill="rgba(255,255,255,0.7)"/>
    <rect x="-7" y="9" width="2.5" height="8" rx="1.25" fill="rgba(255,255,255,0.7)"/>
    <rect x="4.5" y="9" width="2.5" height="8" rx="1.25" fill="rgba(255,255,255,0.7)"/>
    <rect x="-4" y="21" width="2.5" height="10" rx="1.25" fill="rgba(255,255,255,0.7)"/>
    <rect x="1.5" y="21" width="2.5" height="10" rx="1.25" fill="rgba(255,255,255,0.7)"/>
  </g>
  
  <!-- Queue flow indicator - curved arrow -->
  <path d="M 50 120 Q 100 100 150 120" stroke="rgba(255,255,255,0.6)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="145,115 155,120 145,125" fill="rgba(255,255,255,0.6)"/>
  
  <!-- Digital elements - representing virtual queue -->
  <!-- Clock/Time indicator -->
  <g transform="translate(60, 140)">
    <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-8" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="0" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="rgba(255,255,255,0.8)"/>
  </g>
  
  <!-- Phone/Mobile indicator -->
  <g transform="translate(140, 140)">
    <rect x="-6" y="-10" width="12" height="20" rx="3" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <!-- Screen -->
    <rect x="-4" y="-7" width="8" height="12" rx="1" fill="rgba(255,255,255,0.4)"/>
    <!-- Home button -->
    <circle cx="0" cy="7" r="1.5" fill="rgba(255,255,255,0.6)"/>
  </g>
  
  <!-- Position number in center -->
  <g transform="translate(100, 125)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">#1</text>
  </g>
  
  <!-- Company name arc -->
  <path id="textPath" d="M 40 100 A 60 60 0 0 1 160 100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.8)">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      VIRTUAL QUEUE
    </textPath>
  </text>
  
  <!-- Decorative dots -->
  <circle cx="30" cy="50" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="170" cy="50" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="30" cy="150" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="170" cy="150" r="2" fill="rgba(255,255,255,0.3)"/>
</svg> 